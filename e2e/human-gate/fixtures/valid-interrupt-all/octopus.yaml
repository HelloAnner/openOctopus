version: "2.1"

meta:
  workflow_id: "human-gate-interrupt-all"
  name: "Human Gate Interrupt All"

runtime:
  scheduler:
    max_parallel_roles: 2

llm_profiles:
  deterministic_cli:
    provider: "deterministic"
    mode: "cli"
    cli_path: "deterministic"

tool_registry:
  builtin:
    file_read:
      module: "openoctopus.tools.file"
      class: "FileReadTool"

roles:
  - id: "agent_a"
    name: "Agent A"
    type: "react"
    llm_profile: "deterministic_cli"
    system_prompt: "你负责执行任务。"
    tools: ["file_read"]
  - id: "agent_b"
    name: "Agent B"
    type: "react"
    llm_profile: "deterministic_cli"
    system_prompt: "你负责执行任务。"
    tools: ["file_read"]

stages:
  - id: "stage_a"
    name: "Stage A"
    role: "agent_a"
    output:
      - type: "artifact"
        name: "artifact_a"
  - id: "stage_b"
    name: "Stage B"
    role: "agent_b"
    output:
      - type: "artifact"
        name: "artifact_b"

transitions:
  - from: "stage_a"
    to: "__END__"
  - from: "stage_b"
    to: "__END__"
