version: "2.1"

meta:
  workflow_id: "artifact-codex-simple-flow"
  name: "Artifact Codex Simple Flow"

runtime:
  scheduler:
    max_parallel_roles: 1

llm_profiles:
  codex_cli:
    provider: "codex"
    mode: "cli"
    cli_path: "codex"

tool_registry:
  builtin:
    file_read:
      module: "openoctopus.tools.file"
      class: "FileReadTool"
    file_write:
      module: "openoctopus.tools.file"
      class: "FileWriteTool"

roles:
  - id: "agent_a"
    name: "Agent A"
    type: "react"
    llm_profile: "codex_cli"
    system_prompt: |
      你负责读取 context.md 里的 output_artifacts suggested_ref，
      在该位置写一个 3 到 5 行的 Markdown 文件，标题必须是 Artifact A，
      正文至少包含一句 simple artifact flow。
    tools: ["file_read", "file_write"]
  - id: "agent_b"
    name: "Agent B"
    type: "react"
    llm_profile: "codex_cli"
    system_prompt: |
      你负责读取 context.md 里的 input_artifacts 和 output_artifacts suggested_ref，
      读取上游 artifact 内容后，在 suggested_ref 写一个极简 Markdown summary，
      标题必须是 Artifact B，正文至少包含一句 reviewed artifact.
    tools: ["file_read", "file_write"]

stages:
  - id: "stage_a"
    name: "Stage A"
    role: "agent_a"
    output:
      - type: "artifact"
        name: "artifact_a"
  - id: "stage_b"
    name: "Stage B"
    role: "agent_b"
    input:
      - type: "artifact"
        ref: "artifact_a"
    output:
      - type: "artifact"
        name: "artifact_b"

transitions:
  - from: "stage_a"
    to: "stage_b"
  - from: "stage_b"
    to: "__END__"
